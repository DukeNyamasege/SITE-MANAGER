name: Site Manager CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: site_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d site_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/site_manager_test
      DATABASE_SSL: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate legacy Netlify functions
        run: |
          for file in netlify/functions/*.mjs; do
            node --check "$file"
          done

      - name: Validate VPS server and migration scripts
        run: |
          for file in server/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Build production bundle
        run: npm run build
