name: Site Manager CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: site_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d site_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/site_manager_test
      DATABASE_SSL: "false"
      VPS_PUBLISH_MODE: plan
      VPS_PUBLIC_IPV4: 203.0.113.10
      NNN_RUNTIME_RELEASE: nnn-ci-test
      NNN_SHARED_DIST_DIR: /srv/site-manager/nnn/current
      SITE_MANAGER_API_UPSTREAM: http://127.0.0.1:8787
      NNN_LEGACY_EXPECTED_SHA: 148d3fc2d265a2ce724d1503369068fae44cce21

    steps:
      - name: Check out Site Manager
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Site Manager dependencies
        run: npm install --no-audit --no-fund

      - name: Install real staging Caddy dependency
        run: |
          if ! command -v caddy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y caddy
          fi
          sudo systemctl stop caddy.service 2>/dev/null || true
          caddy version

      - name: Validate legacy Netlify functions
        run: |
          for file in netlify/functions/*.mjs; do
            node --check "$file"
          done

      - name: Validate VPS server and migration scripts
        run: |
          for file in server/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate VPS shell package syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find infra -type f -name '*.sh' -print0)

      - name: Validate nnn builder contract
        run: node scripts/validate-nnn-contract.mjs

      - name: Validate shared nnn publishing contract
        run: node scripts/validate-vps-publishing-contract.mjs

      - name: Validate VPS installation contract
        run: node scripts/validate-vps-installation.mjs

      - name: Validate Step 14 staging-edge safety contract
        run: node scripts/validate-staging-edge-contract.mjs

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Validate domain-first onboarding schema
        run: node scripts/validate-domain-first-schema.mjs

      - name: Rehearse new-customer domain-first onboarding
        run: node scripts/rehearse-domain-first-onboarding.mjs | tee ${{ runner.temp }}/domain-first-node-${{ matrix.node-version }}.json

      - name: Validate VPS domain readiness schema
        run: node scripts/validate-domain-schema.mjs

      - name: Validate VPS publishing schema
        run: node scripts/validate-vps-publishing-schema.mjs

      - name: Validate Step 14 staging-edge schema
        run: node scripts/validate-staging-edge-schema.mjs

      - name: Validate Step 15 production eligibility schema
        run: node scripts/validate-production-eligibility-schema.mjs

      - name: Check out pinned production nnn migration source
        uses: actions/checkout@v4
        with:
          repository: DukeNyamasege/nnn
          ref: 148d3fc2d265a2ce724d1503369068fae44cce21
          path: .legacy/nnn

      - name: Audit and import legacy nnn inventory twice
        env:
          NNN_LEGACY_SOURCE_DIR: ${{ github.workspace }}/.legacy/nnn
          LEGACY_NNN_REPORT_PATH: ${{ runner.temp }}/legacy-nnn-audit-node-${{ matrix.node-version }}.json
        run: |
          npm run legacy:audit
          npm run legacy:import
          npm run legacy:import

      - name: Rehearse admin-only legacy ownership assignment
        run: node scripts/rehearse-legacy-migration.mjs

      - name: Build Site Manager production bundle
        run: npm run build

      - name: Check out held nnn migration integration
        uses: actions/checkout@v4
        with:
          repository: DukeNyamasege/nnn
          ref: hold/site-manager-v2-integration-2026-08-20
          path: .staging/nnn

      - name: Build and validate held nnn artifact
        run: |
          cd .staging/nnn
          npm ci
          npm run generate:brand-css
          node scripts/validate-site-manager-rehearsal.js
          npm run build
          node scripts/validate-site-manager-release-artifact.js

      - name: Rehearse dual-run parity and cutover readiness
        env:
          NNN_LEGACY_SOURCE_DIR: ${{ github.workspace }}/.legacy/nnn
          NNN_HELD_RUNTIME_DIR: ${{ github.workspace }}/.staging/nnn
          DUAL_RUN_PARITY_REPORT_PATH: ${{ runner.temp }}/dual-run-parity-node-${{ matrix.node-version }}.json
        run: |
          export NNN_HELD_EXPECTED_SHA="$(git -C .staging/nnn rev-parse HEAD)"
          node scripts/rehearse-dual-run-parity.mjs

      - name: Rehearse immutable cutover planning and invalidation
        run: node scripts/rehearse-cutover-orchestration.mjs | tee ${{ runner.temp }}/cutover-orchestration-node-${{ matrix.node-version }}.json

      - name: Rehearse canary activation and automatic rollback
        env:
          CANARY_EXECUTION_MODE: simulate
          CANARY_SIMULATION_STATE_DIR: ${{ runner.temp }}/canary-simulation-node-${{ matrix.node-version }}
          CANARY_MIN_OBSERVATION_SECONDS: 0
          CANARY_REHEARSAL_REPORT_PATH: ${{ runner.temp }}/canary-rehearsal-node-${{ matrix.node-version }}.json
        run: |
          NNN_SHA="$(git -C .staging/nnn rev-parse HEAD)"
          NNN_CANARY_DIST_DIR="$PWD/.staging/nnn/dist" \
          NNN_CANARY_RELEASE="$NNN_SHA" \
          node scripts/rehearse-canary-cutover.mjs

      - name: Rehearse real Caddy HTTPS staging edge, restart recovery and rollback
        env:
          SITE_MANAGER_ENVIRONMENT: staging
          STAGING_EDGE_MODE: staging
          STAGING_EDGE_APPROVED: YES
          STAGING_EDGE_HOSTNAME: step14.localhost
          STAGING_EDGE_HTTPS_PORT: 18443
          STAGING_EDGE_TLS_MODE: internal
          STAGING_EDGE_CADDY_ADMIN: 127.0.0.1:2020
          STAGING_EDGE_CADDYFILE: ${{ runner.temp }}/step14-caddy-node-${{ matrix.node-version }}/Caddyfile
          STAGING_EDGE_STATE_DIR: ${{ runner.temp }}/step14-caddy-node-${{ matrix.node-version }}
          STAGING_CADDY_BIN: /usr/bin/caddy
          STAGING_EDGE_CURL_BIN: /usr/bin/curl
          STAGING_EDGE_RESOLVE_IP: 127.0.0.1
          STAGING_SITE_MANAGER_API_UPSTREAM: http://127.0.0.1:18787
          STAGING_EDGE_FAILURE_THRESHOLD: 1
          STAGING_EDGE_MONITOR_INTERVAL_MS: 60000
          STAGING_EDGE_MIN_OBSERVATION_SECONDS: 0
          STAGING_EDGE_TOKEN_TTL_MINUTES: 300
          STAGING_EDGE_DRILL_ALLOW_FAILURE: YES
          STAGING_EDGE_REHEARSAL_REPORT_PATH: ${{ runner.temp }}/staging-edge-rehearsal-node-${{ matrix.node-version }}.json
        run: |
          NNN_SHA="$(git -C .staging/nnn rev-parse HEAD)"
          NNN_STAGING_DIST_DIR="$PWD/.staging/nnn/dist" \
          NNN_STAGING_RELEASE="$NNN_SHA" \
          node scripts/rehearse-staging-edge.mjs

      - name: Rehearse production eligibility and final approval gate
        env:
          PRODUCTION_ELIGIBILITY_TTL_MINUTES: 60
          PRODUCTION_ELIGIBILITY_STAGING_MAX_AGE_MINUTES: 60
          PRODUCTION_ELIGIBILITY_REHEARSAL_REPORT_PATH: ${{ runner.temp }}/production-eligibility-node-${{ matrix.node-version }}.json
        run: node scripts/rehearse-production-eligibility.mjs

      - name: Validate staging rehearsal safety contract
        run: node scripts/validate-staging-rehearsal.mjs

      - name: Run full Site Manager and nnn staging rehearsal
        env:
          STAGING_REHEARSAL_REPORT_DIR: ${{ runner.temp }}/site-manager-rehearsals
        run: |
          NNN_SHA="$(git -C .staging/nnn rev-parse HEAD)"
          NNN_REHEARSAL_DIST_DIR="$PWD/.staging/nnn/dist" \
          NNN_REHEARSAL_RELEASE="$NNN_SHA" \
          node scripts/rehearse-staging.mjs

      - name: Upload domain-first, migration, parity, cutover, canary, staging-edge, production-eligibility and lifecycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-manager-rehearsal-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/domain-first-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/legacy-nnn-audit-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/dual-run-parity-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/cutover-orchestration-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/canary-rehearsal-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/canary-simulation-node-${{ matrix.node-version }}
            ${{ runner.temp }}/staging-edge-rehearsal-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/production-eligibility-node-${{ matrix.node-version }}.json
            ${{ runner.temp }}/step14-caddy-node-${{ matrix.node-version }}
            ${{ runner.temp }}/site-manager-rehearsals
          if-no-files-found: ignore
