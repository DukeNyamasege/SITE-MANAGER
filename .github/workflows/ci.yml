name: Site Manager CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: site_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d site_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/site_manager_test
      DATABASE_SSL: "false"
      VPS_PUBLISH_MODE: plan
      NNN_RUNTIME_RELEASE: nnn-ci-test
      NNN_SHARED_DIST_DIR: /srv/site-manager/nnn/current
      SITE_MANAGER_API_UPSTREAM: http://127.0.0.1:8787

    steps:
      - name: Check out Site Manager
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Site Manager dependencies
        run: npm install --no-audit --no-fund

      - name: Validate legacy Netlify functions
        run: |
          for file in netlify/functions/*.mjs; do
            node --check "$file"
          done

      - name: Validate VPS server and migration scripts
        run: |
          for file in server/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate VPS shell package syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find infra -type f -name '*.sh' -print0)

      - name: Validate nnn builder contract
        run: node scripts/validate-nnn-contract.mjs

      - name: Validate shared nnn publishing contract
        run: node scripts/validate-vps-publishing-contract.mjs

      - name: Validate VPS installation contract
        run: node scripts/validate-vps-installation.mjs

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Validate VPS domain readiness schema
        run: node scripts/validate-domain-schema.mjs

      - name: Validate VPS publishing schema
        run: node scripts/validate-vps-publishing-schema.mjs

      - name: Build Site Manager production bundle
        run: npm run build

      - name: Check out held nnn staging integration
        uses: actions/checkout@v4
        with:
          repository: DukeNyamasege/nnn
          ref: feat/staging-rehearsal-contract
          path: .staging/nnn

      - name: Build and validate held nnn artifact
        run: |
          cd .staging/nnn
          npm ci
          npm run generate:brand-css
          node scripts/validate-site-manager-rehearsal.js
          npm run build
          node scripts/validate-site-manager-release-artifact.js

      - name: Validate staging rehearsal safety contract
        run: node scripts/validate-staging-rehearsal.mjs

      - name: Run full Site Manager and nnn staging rehearsal
        env:
          STAGING_REHEARSAL_REPORT_DIR: ${{ runner.temp }}/site-manager-rehearsals
        run: |
          NNN_SHA="$(git -C .staging/nnn rev-parse HEAD)"
          NNN_REHEARSAL_DIST_DIR="$PWD/.staging/nnn/dist" \
          NNN_REHEARSAL_RELEASE="$NNN_SHA" \
          node scripts/rehearse-staging.mjs

      - name: Upload staging rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-rehearsal-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/site-manager-rehearsals
          if-no-files-found: ignore
